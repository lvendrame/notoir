# Built-in theme (docs/specs/21-themes-and-design-system.md).
[meta]
id = "notoir-midnight"
name = "Notoir Midnight"
kind = "dark"
format = 1

[ui]
"bg.app" = "#14161b"
"bg.panel" = "#181a20"
"bg.panelRaised" = "#22252d"
"bg.editor" = "#1b1d23"
"bg.overlay" = "#24272f"
border = "#2b2e37"
"border.strong" = "#3a3e4a"
"text.primary" = "#e6e7ea"
"text.secondary" = "#a3a7b2"
"text.tertiary" = "#7a7f8c"
"text.disabled" = "#555a66"
accent = "#7aa2ff"
"accent.strong" = "#4f7be8"
danger = "#ff6b6b"
warning = "#e5b454"
success = "#6cc58c"
info = "#6cb6ff"
"accent.soft" = { base = "accent", alpha = 0.14 }
"focus.ring" = { base = "accent" }
"shadow.float" = { color = "#000000", alpha = 0.4 }

[editor]
background = { base = "bg.editor" }
foreground = { base = "text.primary" }
findMatch = { base = "warning", alpha = 0.25 }
findMatchCurrent = { base = "warning", alpha = 0.5 }
bracketMatch = { base = "accent", alpha = 0.25 }
"gutter.background" = { base = "bg.editor" }
"gutter.lineNumber" = { base = "text.tertiary" }
"gutter.lineNumberActive" = { base = "text.primary" }
"minimap.block" = { base = "text.tertiary", alpha = 0.6 }
"minimap.viewport" = { base = "text.primary", alpha = 0.08 }
"minimap.viewportHover" = { base = "text.primary", alpha = 0.14 }
lineHighlight = "#20232a"
selection = "#2f4170"
selectionInactive = "#283044"
cursor = "#e6e7ea"
whitespace = "#3a3e4a"
indentGuide = "#2b2e37"
ruler = "#2b2e37"

[syntax]
comment = { color = "#7a7f8c", italic = true }
keyword = "#c792ea"
string = "#a5d6a7"
number = "#f0a875"
constant = "#f78c6c"
function = "#82aaff"
type = "#ffcb6b"
variable = "#e6e7ea"
property = "#89ddff"
operator = "#89ddff"
punctuation = "#a3a7b2"
tag = "#f07178"
attribute = "#c792ea"
regex = "#a5d6a7"
escape = "#f78c6c"
heading = { color = "#7aa2ff", bold = true }
emphasis = { color = "#e6e7ea", italic = true }
strong = { color = "#e6e7ea", bold = true }
link = "#82aaff"
code = "#a5d6a7"
quote = { color = "#a3a7b2", italic = true }
listMarker = "#7aa2ff"
invalid = "#ff6b6b"

[git]
added = "#6cc58c"
modified = "#e5b454"
deleted = "#ff6b6b"
untracked = "#7fd1c7"
renamed = "#82aaff"
conflict = "#ff7ac6"
ignored = "#555a66"

[diff]
insertedLine = { base = "git.added", alpha = 0.12 }
removedLine = { base = "git.deleted", alpha = 0.12 }
insertedText = { base = "git.added", alpha = 0.3 }
removedText = { base = "git.deleted", alpha = 0.3 }
gutterInserted = { base = "git.added" }
gutterRemoved = { base = "git.deleted" }
