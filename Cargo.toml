[workspace]
members = ["crates/*", "apps/*", "tools/*"]
resolver = "3"

[workspace.package]
version = "0.1.6"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
notoir-core = { path = "crates/notoir-core" }
notoir-editor = { path = "crates/notoir-editor" }
notoir-platform = { path = "crates/notoir-platform" }
notoir-storage = { path = "crates/notoir-storage" }
notoir-workspace = { path = "crates/notoir-workspace" }
notoir-git = { path = "crates/notoir-git" }
notoir-mcp = { path = "crates/notoir-mcp" }
notoir-plugins = { path = "crates/notoir-plugins" }

eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36.2"
egui_kittest = "0.36.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.9"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
resvg = "0.48.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
skrifa = "0.44.0"
fontdb = { version = "0.24.0", default-features = false, features = ["std", "fs"] }
directories = "6.0.0"
sys-locale = "0.3.2"
tempfile = "3"
ropey = "1.6"
encoding_rs = "0.8"
chardetng = "0.1"
proptest = "1"
rfd = "0.17.2"
pollster = "1.0.1"
interprocess = "2.4.5"
arboard = { version = "3.6.1", default-features = false }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
toml_edit = "0.25.17"
uuid = { version = "1.28.0", features = ["v4"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
notify = "8.2.0"
regex = "1.13.1"
similar = "3.2.0"
yaml-edit = { version = "0.3.2", default-features = false }
rowan = "0.16"
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
open = "5.4.4"
# Runtime: load the prebuilt packdump only. Build time (notoir-editor/build.rs)
# adds YAML grammar loading and dump creation.
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "dump-load", "regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-default-fancy"] }
ignore = "0.4.33"
globset = "0.4.20"
trash = "5.2.9"
# rustls (ring) with the Mozilla root store: HTTPS for the updater and plugins.
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
minisign-verify = "0.3.0"
semver = "1.0.28"
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Release artifacts (scripts/package.sh): like `release`, with debug info
# split next to the binary (.dSYM / .pdb / .dwp) and archived separately for
# crash analysis.
[profile.dist]
inherits = "release"
debug = "line-tables-only"
split-debuginfo = "packed"
