name: Release

# Tag push (v1.2.3) builds every package format on its OS, signs when the
# secrets exist, and attaches packages, checksums and debug symbols to a
# GitHub release (docs/specs/31 §Packaging).
# A manual run (Actions → Release → Run workflow) builds the packages as
# workflow artifacts; with "publish" ticked it also tags the commit
# v<Cargo version> and publishes the release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release tagged v<Cargo version> at this commit"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Built into the binary (spec 31 §Updates); without them the updater is
  # unavailable. The key is minisign's public key line. The manifest URL
  # defaults to the latest (non-prerelease) release's update.json.
  NOTOIR_UPDATE_URL: ${{ vars.NOTOIR_UPDATE_URL || format('https://github.com/{0}/releases/latest/download/update.json', github.repository) }}
  NOTOIR_UPDATE_PUBKEY: ${{ vars.NOTOIR_UPDATE_PUBKEY }}

jobs:
  # Installers carry the Cargo version and update.json the tag's: they must
  # agree, so a mismatched tag fails before an hour of packaging. Outputs the
  # release tag, or nothing when this run does not publish.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: tag
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          version=$(cargo pkgid -p notoir)
          version=${version##*[#@]}
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the Cargo version $version"
              exit 1
            fi
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [[ "$PUBLISH" == "true" ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              echo "::error::tag v$version already exists: bump the version in Cargo.toml first"
              exit 1
            fi
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: package (${{ matrix.os }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Secrets cannot be tested in `if:` directly.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      HAS_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libwayland-dev libfontconfig1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libfuse2
      - name: cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          echo "$WINDOWS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.pfx"
          echo "WINDOWS_CERTIFICATE_PATH=$RUNNER_TEMP/cert.pfx" >> "$GITHUB_ENV"
      - name: Import GPG key
        if: runner.os == 'Linux' && env.HAS_GPG_KEY == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Package
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: |
            target/packages/*.dmg
            target/packages/*.msi
            target/packages/*-setup.exe
            target/packages/*.deb
            target/packages/*.AppImage
            target/packages/*.asc
            target/packages/*.zip
            target/packages/*.tar.gz
            target/packages/SHA256SUMS-*.txt
          if-no-files-found: error

  release:
    needs: [version, package]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    env:
      HAS_MINISIGN_KEY: ${{ secrets.MINISIGN_SECRET_KEY != '' }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combined checksums
        run: cat dist/SHA256SUMS-*.txt > dist/SHA256SUMS.txt
      - uses: actions/checkout@v5
        with:
          path: src
      - name: Signed update manifest
        if: env.HAS_MINISIGN_KEY == 'true'
        env:
          # A password-less minisign secret key (`minisign -G -W`).
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y minisign
          python3 src/scripts/update-manifest.py dist "$TAG" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m dist/update.json \
            -x dist/update.json.minisig -t "notoir $TAG"
          rm -f "$RUNNER_TEMP/minisign.key"
      - uses: softprops/action-gh-release@v2
        with:
          # Created at this commit when the tag does not exist yet (manual runs).
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(env.TAG, '-') }}
