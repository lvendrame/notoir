# Built-in theme (docs/specs/21-themes-and-design-system.md).
[meta]
id = "notoir-paper"
name = "Notoir Paper"
kind = "light"
format = 1

[ui]
"bg.app" = "#ecebe6"
"bg.panel" = "#f3f2ee"
"bg.panelRaised" = "#e4e2dc"
"bg.editor" = "#fbfaf7"
"bg.overlay" = "#ffffff"
border = "#d9d6ce"
"border.strong" = "#bfbbb1"
"text.primary" = "#22231f"
"text.secondary" = "#55574f"
"text.tertiary" = "#75776e"
"text.disabled" = "#a5a79f"
accent = "#3a5fc8"
"accent.strong" = "#2f4fae"
danger = "#c6392f"
warning = "#a8740d"
success = "#2f8a4b"
info = "#2a6fb0"
"accent.soft" = { base = "accent", alpha = 0.14 }
"focus.ring" = { base = "accent" }
"shadow.float" = { color = "#000000", alpha = 0.18 }

[editor]
background = { base = "bg.editor" }
foreground = { base = "text.primary" }
findMatch = { base = "warning", alpha = 0.25 }
findMatchCurrent = { base = "warning", alpha = 0.5 }
bracketMatch = { base = "accent", alpha = 0.25 }
"gutter.background" = { base = "bg.editor" }
"gutter.lineNumber" = { base = "text.tertiary" }
"gutter.lineNumberActive" = { base = "text.primary" }
"minimap.block" = { base = "text.tertiary", alpha = 0.6 }
"minimap.viewport" = { base = "text.primary", alpha = 0.08 }
"minimap.viewportHover" = { base = "text.primary", alpha = 0.14 }
lineHighlight = "#f3f1ea"
selection = "#c9d6f5"
selectionInactive = "#e2e6ef"
cursor = "#22231f"
whitespace = "#c9c6bd"
indentGuide = "#e4e2dc"
ruler = "#e4e2dc"

[syntax]
comment = { color = "#8a8c82", italic = true }
keyword = "#8a3fb0"
string = "#3d7a2e"
number = "#b05a12"
constant = "#a8501a"
function = "#2a5bbf"
type = "#9a6a00"
variable = "#22231f"
property = "#1f6f8a"
operator = "#55574f"
punctuation = "#55574f"
tag = "#b03a3a"
attribute = "#8a3fb0"
regex = "#3d7a2e"
escape = "#a8501a"
heading = { color = "#2f4fae", bold = true }
emphasis = { color = "#22231f", italic = true }
strong = { color = "#22231f", bold = true }
link = "#2a5bbf"
code = "#3d7a2e"
quote = { color = "#55574f", italic = true }
listMarker = "#3a5fc8"
invalid = "#c6392f"

[git]
added = "#2f8a4b"
modified = "#a8740d"
deleted = "#c6392f"
untracked = "#1f7f74"
renamed = "#2a5bbf"
conflict = "#b0287a"
ignored = "#a5a79f"

[diff]
insertedLine = { base = "git.added", alpha = 0.12 }
removedLine = { base = "git.deleted", alpha = 0.12 }
insertedText = { base = "git.added", alpha = 0.3 }
removedText = { base = "git.deleted", alpha = 0.3 }
gutterInserted = { base = "git.added" }
gutterRemoved = { base = "git.deleted" }
