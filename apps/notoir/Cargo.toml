[package]
name = "notoir"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Notoir — a fast native text editor and workspace"

[lints]
workspace = true

[dependencies]
notoir-core.workspace = true
notoir-platform.workspace = true
notoir-storage.workspace = true
notoir-workspace.workspace = true
notoir-git.workspace = true
notoir-mcp.workspace = true
notoir-plugins.workspace = true
similar.workspace = true
zip.workspace = true
encoding_rs.workspace = true
uuid.workspace = true
eframe.workspace = true
egui.workspace = true
resvg.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
arboard.workspace = true
unicode-segmentation.workspace = true
notoir-editor.workspace = true
image = { workspace = true, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot", "eframe"] }
image.workspace = true
tempfile.workspace = true
git2.workspace = true
ureq.workspace = true
tokio = { version = "1.53.3", features = ["sync"] }
ed25519-dalek = "3.0.0"
base64 = "0.23"
sha2 = "0.11.1"

# `scripts/package.sh` (cargo-packager 0.11): .app/.dmg (universal), .msi and
# NSIS, .deb and AppImage. The bundle identifier must never change after the
# first release (spec 31).
[package.metadata.packager]
product-name = "Notoir"
identifier = "dev.notoir.Notoir"
description = "A fast native text editor and workspace"
long-description = "Notoir is a cross-platform text editor and workspace with true splits, scratchpads, crash recovery and a command palette."
category = "DeveloperTool"
publisher = "Notoir"
homepage = "https://notoir.dev"
copyright = "Copyright © Notoir contributors"
out-dir = "../../target/packages"
binaries = [{ path = "notoir", main = true }]
icons = [
    "../../assets/app-icon/png/32x32.png",
    "../../assets/app-icon/png/128x128.png",
    "../../assets/app-icon/png/256x256.png",
    "../../assets/app-icon/png/512x512.png",
    "../../assets/app-icon/Notoir.icns",
    "../../assets/app-icon/Notoir.ico",
]
file-associations = [
    { extensions = ["txt", "text", "log"], mime-type = "text/plain", description = "Text document", role = "editor" },
    { extensions = ["md", "markdown"], mime-type = "text/markdown", description = "Markdown document", role = "editor" },
    { extensions = ["json", "jsonc"], mime-type = "application/json", description = "JSON document", role = "editor" },
    { extensions = ["toml"], mime-type = "application/toml", description = "TOML document", role = "editor" },
    { extensions = ["yaml", "yml"], mime-type = "application/yaml", description = "YAML document", role = "editor" },
    { extensions = ["csv"], mime-type = "text/csv", description = "CSV document", role = "editor" },
]

[package.metadata.packager.macos]
minimum-system-version = "11.0"

[package.metadata.packager.deb]
depends = ["libgtk-3-0", "libxkbcommon0", "libxkbcommon-x11-0", "libfontconfig1"]
section = "editors"
priority = "optional"

[package.metadata.packager.wix]
languages = ["en-US"]

[package.metadata.packager.nsis]
installer-mode = "currentUser"
